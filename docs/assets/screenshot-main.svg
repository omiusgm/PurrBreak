    <text x="232" y="224" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25" fill="#857b75">YouTube-паузы и меньше ловушек в Shorts/Reels</text>

    <text x="118" y="294" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="750" fill="#2f2b28">YouTube активен</text>
    <text x="800" y="294" font-family="SFMono-Regular, Menlo, monospace" font-size="26" fill="#7e746d">До заставки: 15:08</text>
    <rect x="118" y="330" width="924" height="10" rx="5" fill="#ede7e1"/>
    <rect x="118" y="330" width="230" height="10" rx="5" fill="#ff8a2a"/>
    <text x="118" y="385" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" fill="#857b75">Просмотрено</text>
    <text x="846" y="385" font-family="SFMono-Regular, Menlo, monospace" font-size="21" fill="#7e746d">04:52 / 20:00</text>
    <text x="118" y="424" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" fill="#857b75">Сегодня YouTube: 32м • Паузы: 2 • Спасено: 10м</text>

    <line x1="118" y1="468" x2="1042" y2="468" stroke="#eadfd6"/>

    <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26" fill="#302b28">
      <text x="118" y="526">Заставка</text>
      <rect x="258" y="493" width="260" height="48" rx="8" fill="#f0ebe7"/>
      <text x="282" y="526">Лунная дрема</text>

      <text x="118" y="592">Меню-бар</text>
      <rect x="258" y="559" width="260" height="48" rx="8" fill="#f0ebe7"/>
      <text x="282" y="592">Только 15м</text>

      <text x="590" y="526">Лимит YouTube</text>
      <text x="942" y="526" fill="#857b75">20 мин</text>
      <text x="590" y="592">Лимит Shorts</text>
      <text x="956" y="592" fill="#857b75">5 мин</text>
    </g>

    <g transform="translate(118 634)">
      <rect x="0" y="0" width="234" height="48" rx="8" fill="#ff8a2a"/>
      <text x="28" y="32" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="760" fill="#261404">Тест заставки</text>
      <rect x="252" y="0" width="238" height="48" rx="8" fill="#f0ebe7"/>
      <text x="282" y="32" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" fill="#302b28">Блокировка сейчас</text>
      <rect x="508" y="0" width="230" height="48" rx="8" fill="#f0ebe7"/>
      <text x="538" y="32" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" fill="#302b28">Отправить отзыв</text>

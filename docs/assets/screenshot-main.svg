<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="760" viewBox="0 0 1160 760" role="img" aria-labelledby="title desc">
  <title id="title">PurrBreak main window</title>
  <desc id="desc">A clean mock screenshot of the PurrBreak settings window with timer, stats, limits, menu bar display, and launch at login settings.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff8ef"/>
      <stop offset="1" stop-color="#eff8f7"/>
    </linearGradient>
    <linearGradient id="icon" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#122427"/>
      <stop offset="1" stop-color="#071012"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#5a3a22" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1160" height="760" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="80" y="56" width="1000" height="648" rx="8" fill="#fffdfa" stroke="#e8ddd3"/>
    <rect x="80" y="56" width="1000" height="54" rx="8" fill="#f6f0eb"/>
    <rect x="80" y="102" width="1000" height="8" fill="#f6f0eb"/>
    <circle cx="112" cy="84" r="12" fill="#ff5f57"/>
    <circle cx="150" cy="84" r="12" fill="#ffbd2e"/>
    <circle cx="188" cy="84" r="12" fill="#28c840"/>
    <text x="230" y="93" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#625a55">PurrBreak</text>

    <g transform="translate(118 150)">
      <rect x="0" y="0" width="86" height="86" rx="18" fill="url(#icon)"/>
      <ellipse cx="48" cy="52" rx="31" ry="22" fill="#f28b22"/>
      <circle cx="34" cy="39" r="18" fill="#f69b38"/>
      <path d="M20 29 L27 12 L34 31 Z" fill="#f69b38"/>
      <path d="M39 27 L49 11 L51 34 Z" fill="#f69b38"/>
      <path d="M22 54 C29 70 58 71 69 53" fill="#f8c66e"/>
      <path d="M31 40 C35 45 40 45 44 40" fill="none" stroke="#462111" stroke-width="3" stroke-linecap="round"/>
      <path d="M53 38 C57 43 62 43 66 38" fill="none" stroke="#462111" stroke-width="3" stroke-linecap="round"/>
      <path d="M47 49 L44 54 L50 54 Z" fill="#eb6f4c"/>
      <text x="53" y="28" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="800" fill="#ffd16f">z z</text>
    </g>

